<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HDL Delivery</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        .auth-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
        }

        .auth-logo {
            display: flex;
            justify-content: center;
            color: var(--accent);
            margin-bottom: 24px;
        }

        .auth-title {
            text-align: center;
            font-size: 1.75rem;
            margin-bottom: 32px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-hint);
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider:not(:empty)::before {
            margin-right: .5em;
        }

        .divider:not(:empty)::after {
            margin-left: .5em;
        }
    </style>
</head>

<body>

    <div class="auth-page">
        <div class="card auth-card">
            <div class="auth-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="48" height="48">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 2L2 7l10 5 10-5-10-5zm0 10l-10 5 10 5 10-5-10-5z" />
                </svg>
            </div>
            <h1 class="auth-title">Welcome back</h1>

            <form id="login-form">
                <div class="form-group">
                    <label>Email address</label>
                    <input type="email" id="email" class="input-control" placeholder="arya@example.com"
                        value="aryan@demo.com" required>
                </div>
                <div class="form-group">
                    <label style="display:flex; justify-content:space-between">
                        Password
                        <a href="#" style="color:var(--accent); font-weight:400; font-size:0.85rem">Forgot password?</a>
                    </label>
                    <div style="position:relative">
                        <input type="password" id="password" class="input-control" placeholder="••••••••"
                            value="demo123" required>
                        <!-- Toggle eye could go here -->
                    </div>
                </div>

                <div id="login-error" class="error-text" style="margin-bottom:16px; text-align:center;"></div>

                <button type="submit" class="btn btn-primary btn-block" id="login-btn">Log In</button>
            </form>

            <div class="divider">or</div>

            <div style="text-align:center;">
                <span style="color:var(--text-secondary)">Don't have an account?</span>
                <a href="register.html" style="color:var(--accent); font-weight:600; margin-left:8px;">Sign up</a>
            </div>

            <div style="text-align:center; margin-top:24px;">
                <a href="index.html" style="color:var(--text-hint); font-size:0.9rem;">← Back to Home</a>
            </div>
        </div>
    </div>

    <script src="/customer/js/ui.js"></script>
    <script src="/customer/js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const em = document.getElementById('email').value;
            const pw = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            window.HDL_CUSTOMER.Auth.login(em, pw, btn);
        });
    </script>
</body>

</html>
