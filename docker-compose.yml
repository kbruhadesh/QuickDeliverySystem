services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: drone_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: drone_delivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drone_cache
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: drone_backend
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/drone_delivery
      REDIS_URL: redis://redis:6379
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./real-world-drone-simulation:/real-world-drone-simulation

  celery_worker:
    build: ./backend
    container_name: drone_celery_worker
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/drone_delivery
      REDIS_URL: redis://redis:6379
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    command: celery -A app.tasks worker --loglevel=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./real-world-drone-simulation:/real-world-drone-simulation

  frontend:
    image: nginx:alpine
    container_name: drone_frontend
    ports:
      - "80:80"
    volumes:
      - .:/usr/share/nginx/html:ro  # Mounts the root so index.html, admin/, customer/ are accessible
    depends_on:
      - backend

volumes:
  postgres_data:
