<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Control | HDL Quick-Commerce</title>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        .sim-controls {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-family: var(--font-heading);
            letter-spacing: 0.05em;
        }

        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8B9AB3;
        }

        .status-badge.running .dot {
            background: var(--success);
            animation: pulse-dot 1.5s infinite;
        }

        .status-badge.paused .dot {
            background: var(--warning);
        }

        .status-badge.stopped .dot {
            background: var(--danger);
        }

        @keyframes pulse-dot {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media(max-width: 900px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        .log-container {
            background: #F9FAFB;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            height: 320px;
            overflow-y: auto;
            padding: 16px;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry .time {
            color: var(--text-secondary);
            margin-right: 8px;
        }

        .log-entry .msg {
            color: #111827;
        }

        .log-entry.error .msg {
            color: var(--danger);
        }

        .log-entry.success .msg {
            color: var(--success);
        }

        .log-entry.warn .msg {
            color: var(--warning);
        }
    </style>
</head>

<body>

    <div id="app-container">
        <aside id="sidebar">
            <div class="logo-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"
                    style="color:var(--accent);">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 2L2 7l10 5 10-5-10-5zm0 10l-10 5 10 5-10-5-10-5zm0 10l-10 5 10 5 10-5-10-5z" />
                </svg>
                <h1>HDL System</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item"><span>📊</span> Dashboard</a>
                <a href="orders.html" class="nav-item"><span>📦</span> Orders</a>
                <a href="map.html" class="nav-item"><span>🗺️</span> Live Map</a>
                <a href="drones.html" class="nav-item"><span>🚁</span> Drone Fleet</a>
                <a href="assignments.html" class="nav-item"><span>📋</span> Assignments</a>
                <a href="analytics.html" class="nav-item"><span>📈</span> Analytics</a>
                <a href="dark-stores.html" class="nav-item">
                    <span>??</span> Dark Stores
                </a>
                <div class="nav-divider"></div>
                <a href="simulation.html" class="nav-item active admin-only dev-only"><span>🎮</span> Simulation</a>
                <a href="benchmarks.html" class="nav-item admin-only dev-only"><span>⚡</span> Benchmarks</a>
                <a href="settings.html" class="nav-item admin-only"><span>⚙️</span> Settings</a>
            </nav>
        </aside>

        <main id="main-content">
            <header id="topbar">
                <h2 class="page-title">Simulation Control</h2>
                <div class="status-center">
                    <div class="status-dot"></div>
                    <span>System Online</span>
                </div>
                <div class="user-controls">
                    <span class="user-name">User</span>
                    <button class="btn-logout">Logout</button>
                </div>
            </header>

            <div id="page-content">
                <div class="container">

                    <div class="sim-controls">
                        <div class="status-badge stopped" id="sim-status-badge">
                            <div class="dot"></div>
                            <span id="sim-status-text">STOPPED</span>
                        </div>

                        <div style="flex:1"></div>

                        <button class="btn btn-primary" onclick="setSimStatus('running')">▶ Start</button>
                        <button class="btn btn-warning" onclick="setSimStatus('paused')">⏸ Pause</button>
                        <button class="btn btn-danger" onclick="setSimStatus('stopped')">⏹ Stop</button>
                        <button class="btn btn-secondary" onclick="resetSim()">↺ Reset</button>

                        <div style="width:1px; height:24px; background:var(--border); margin: 0 8px;"></div>

                        <div class="filter-tabs" style="margin:0;" id="speed-selector">
                            <button class="pill-btn active">1x</button>
                            <button class="pill-btn">2x</button>
                            <button class="pill-btn">5x</button>
                            <button class="pill-btn">10x</button>
                        </div>
                    </div>

                    <div class="control-panel">
                        <div style="display:flex; flex-direction:column; gap:24px;">

                            <!-- Orders Module -->
                            <div class="card">
                                <h3 style="margin-bottom:16px; font-size:1.1rem;">Order Generation</h3>
                                <div style="display:flex; gap:12px; align-items:flex-end;">
                                    <div class="form-group" style="margin:0; flex:1;">
                                        <label>Number of Orders</label>
                                        <input type="number" id="gen-order-num" class="input-control" value="10" min="1"
                                            max="100">
                                    </div>
                                    <button class="btn btn-secondary" onclick="generateOrders()">Generate</button>
                                </div>
                            </div>

                            <!-- Failure Module -->
                            <div class="card">
                                <h3 style="margin-bottom:16px; font-size:1.1rem;">Failure Injection</h3>
                                <div style="display:flex; gap:12px; align-items:flex-end;">
                                    <div class="form-group" style="margin:0; flex:1;">
                                        <label>Target In-Flight Drone</label>
                                        <select id="fail-drone-sel" class="input-control">
                                            <!-- JS populated -->
                                        </select>
                                    </div>
                                    <button class="btn btn-danger" onclick="injectFailure()">Inject Failure</button>
                                </div>
                            </div>

                        </div>

                        <!-- Event Log -->
                        <div class="card" style="display:flex; flex-direction:column; padding:0; overflow:hidden;">
                            <div
                                style="padding: 16px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2);">
                                <h3 style="margin:0; font-size:1.1rem;">Live Event Log</h3>
                            </div>
                            <div class="log-container" id="event-log">
                                <!-- JS populated -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="js/mock-data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script>
        let simStatus = 'stopped';
        let logInterval = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (window.HDL.Router) window.HDL.Router.init();

            // Speed selector
            document.querySelectorAll('#speed-selector .pill-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    document.querySelectorAll('#speed-selector .pill-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    window.HDL.UI.showToast(`Simulation speed set to ${e.target.textContent}`, 'info');
                });
            });

            populateDrones();
            renderLogs();
        });

        function setSimStatus(status) {
            if (simStatus === status && status !== 'stopped') return;

            simStatus = status;
            const badge = document.getElementById('sim-status-badge');
            const text = document.getElementById('sim-status-text');

            badge.className = `status-badge ${status}`;
            text.textContent = status.toUpperCase();

            if (status === 'running') {
                window.HDL.UI.showToast('Simulation started', 'success');
                addLog('ℹ️ Simulation Engine started.', 'info');
                if (!logInterval) {
                    logInterval = setInterval(simulateLiveEvents, 3000);
                }
            } else if (status === 'paused') {
                window.HDL.UI.showToast('Simulation paused', 'warning');
                addLog('⏸️ Simulation paused.', 'warn');
                clearInterval(logInterval);
                logInterval = null;
            } else {
                window.HDL.UI.showToast('Simulation stopped', 'error');
                addLog('⏹️ Simulation stopped.', 'error');
                clearInterval(logInterval);
                logInterval = null;
            }
        }

        function resetSim() {
            setSimStatus('stopped');
            addLog('🔄 System Reset requested...', 'info');
            setTimeout(() => {
                document.getElementById('event-log').innerHTML = '';
                window.HDL.mockData.eventLog = [];
                addLog('ℹ️ System Reset complete.', 'success');
            }, 500);
        }

        function populateDrones() {
            const sel = document.getElementById('fail-drone-sel');
            let html = '';
            window.HDL.mockData.drones.forEach(d => {
                if (d.status === 'in-flight' || d.status === 'assigned') {
                    html += `<option value="${d.id}">${d.id} (${d.model})</option>`;
                }
            });
            if (!html) html = '<option value="">No active drones</option>';
            sel.innerHTML = html;
        }

        function generateOrders() {
            const num = parseInt(document.getElementById('gen-order-num').value);
            if (isNaN(num) || num < 1) return;

            window.HDL.UI.showToast(`Generated ${num} random orders`, 'success');
            addLog(`📦 Generated ${num} new orders into the queue.`, 'info');
        }

        function injectFailure() {
            const sel = document.getElementById('fail-drone-sel');
            const droneId = sel.value;
            if (!droneId) return;

            window.HDL.UI.showConfirm(`Are you sure you want to forcibly fail Drone ${droneId}?`, () => {
                // Find drone and fail
                const drone = window.HDL.mockData.drones.find(d => d.id === droneId);
                if (drone) {
                    drone.status = 'failed';
                    drone.battery = 0; // simulating catastrophic fail
                    window.HDL.UI.showToast(`Drone ${droneId} failed!`, 'error');
                    addLog(`⚠️ CRITICAL: Drone ${droneId} engine failure! Emergency landing.`, 'error');

                    setTimeout(() => {
                        addLog(`🔄 Reassigning Order from Drone ${droneId} to backup...`, 'warn');
                    }, 1500);

                    populateDrones();
                }
            });
        }

        function addLog(message, type = 'info') {
            const now = new Date();
            const timeStr = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
            const fullMsg = `${timeStr} ${message}`;

            window.HDL.mockData.eventLog.push(fullMsg);
            renderNewLogEntry(timeStr, message, type);
        }

        function renderLogs() {
            const container = document.getElementById('event-log');
            container.innerHTML = '';
            window.HDL.mockData.eventLog.forEach(log => {
                // basic parse
                const parts = log.split('] ');
                const timeStr = parts[0] + ']';
                const msg = parts[1] || '';

                let type = 'info';
                if (msg.includes('✅')) type = 'success';
                if (msg.includes('⚠️')) type = 'warn';
                if (msg.includes('❌') || msg.includes('CRITICAL')) type = 'error';

                renderNewLogEntry(timeStr, msg, type);
            });
        }

        function renderNewLogEntry(timeStr, msg, type) {
            const container = document.getElementById('event-log');
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerHTML = `<span class="time">${timeStr}</span><span class="msg">${msg}</span>`;

            // prepend or append layout preference? The prompt says "event log feed... auto scrolls to bottom. new events prepended... wait, if it auto scrolls to bottom, usually we append." Let's append and scroll.
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // Faking live events
        const randomEvents = [
            '✅ Drone D4 completed its delivery and is returning to base.',
            'ℹ️ Weather API reported wind increase in Sector 7.',
            '✅ Optimizer re-calculated routes. Saved 0.4kg CO2.',
            '⚠️ Drone D2 telemetry latency spike (1200ms).',
            '📦 Order ORD-1099 assigned to Drone D8.'
        ];
        function simulateLiveEvents() {
            const evt = randomEvents[Math.floor(Math.random() * randomEvents.length)];

            let type = 'info';
            if (evt.includes('✅')) type = 'success';
            if (evt.includes('⚠️')) type = 'warn';

            addLog(evt, type);
        }
    </script>
</body>

</html>
