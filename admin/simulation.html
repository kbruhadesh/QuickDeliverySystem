<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Control | HDL Quick-Commerce</title>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">

    <style>
        .sim-controls {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-family: var(--font-heading);
            letter-spacing: 0.05em;
        }

        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #8B9AB3;
        }

        .status-badge.running .dot {
            background: var(--success);
            animation: pulse-dot 1.5s infinite;
        }

        .status-badge.paused .dot {
            background: var(--warning);
        }

        .status-badge.stopped .dot {
            background: var(--danger);
        }

        @keyframes pulse-dot {
            0% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(34, 197, 94, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(34, 197, 94, 0);
            }
        }

        .control-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        @media(max-width: 900px) {
            .control-panel {
                grid-template-columns: 1fr;
            }
        }

        .log-container {
            background: #F9FAFB;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            height: 320px;
            overflow-y: auto;
            padding: 16px;
            font-family: monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 4px;
        }

        .log-entry .time {
            color: var(--text-secondary);
            margin-right: 8px;
        }

        .log-entry .msg {
            color: #111827;
        }

        .log-entry.error .msg {
            color: var(--danger);
        }

        .log-entry.success .msg {
            color: var(--success);
        }

        .log-entry.warn .msg {
            color: var(--warning);
        }
    </style>
</head>

<body>

    <div id="app-container">
        <aside id="sidebar">
            <div class="logo-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"
                    style="color:var(--accent);">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 2L2 7l10 5 10-5-10-5zm0 10l-10 5 10 5-10-5-10-5zm0 10l-10 5 10 5 10-5-10-5z" />
                </svg>
                <h1>HDL System</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item"><span>📊</span> Dashboard</a>
                <a href="orders.html" class="nav-item"><span>📦</span> Orders</a>
                <a href="map.html" class="nav-item"><span>🗺️</span> Live Map</a>
                <a href="drones.html" class="nav-item"><span>🚁</span> Drone Fleet</a>
                <a href="assignments.html" class="nav-item"><span>📋</span> Assignments</a>
                <a href="analytics.html" class="nav-item"><span>📈</span> Analytics</a>
                <a href="dark-stores.html" class="nav-item">
                    <span>??</span> Dark Stores
                </a>
                <div class="nav-divider"></div>
                <a href="simulation.html" class="nav-item active admin-only dev-only"><span>🎮</span> Simulation</a>
                <a href="benchmarks.html" class="nav-item admin-only dev-only"><span>⚡</span> Benchmarks</a>
                <a href="settings.html" class="nav-item admin-only"><span>⚙️</span> Settings</a>
            </nav>
        </aside>

        <main id="main-content">
            <header id="topbar">
                <h2 class="page-title">Simulation Control</h2>
                <div class="status-center">
                    <div class="status-dot"></div>
                    <span>System Online</span>
                </div>
                <div class="user-controls">
                    <span class="user-name">User</span>
                    <button class="btn-logout">Logout</button>
                </div>
            </header>

            <div id="page-content">
                <div class="container">

                    <div class="sim-controls">
                        <div class="status-badge stopped" id="sim-status-badge">
                            <div class="dot"></div>
                            <span id="sim-status-text">STOPPED</span>
                        </div>

                        <div style="flex:1"></div>

                        <button class="btn btn-primary" onclick="setSimStatus('running')">▶ Start</button>
                        <button class="btn btn-warning" onclick="setSimStatus('paused')">⏸ Pause</button>
                        <button class="btn btn-danger" onclick="setSimStatus('stopped')">⏹ Stop</button>
                        <button class="btn btn-secondary" onclick="resetSim()">↺ Reset</button>

                        <div style="width:1px; height:24px; background:var(--border); margin: 0 8px;"></div>

                        <div class="filter-tabs" style="margin:0;" id="speed-selector">
                            <button class="pill-btn active">1x</button>
                            <button class="pill-btn">2x</button>
                            <button class="pill-btn">5x</button>
                            <button class="pill-btn">10x</button>
                        </div>
                    </div>

                    <div class="control-panel">
                        <div style="display:flex; flex-direction:column; gap:24px;">

                            <!-- Orders Module -->
                            <div class="card">
                                <h3 style="margin-bottom:16px; font-size:1.1rem;">Order Generation</h3>
                                <div style="display:flex; gap:12px; align-items:flex-end;">
                                    <div class="form-group" style="margin:0; flex:1;">
                                        <label>Number of Orders</label>
                                        <input type="number" id="gen-order-num" class="input-control" value="10" min="1"
                                            max="100">
                                    </div>
                                    <button class="btn btn-secondary" onclick="generateOrders()">Generate</button>
                                </div>
                            </div>

                            <!-- Failure Module -->
                            <div class="card">
                                <h3 style="margin-bottom:16px; font-size:1.1rem;">Failure Injection</h3>
                                <div style="display:flex; gap:12px; align-items:flex-end;">
                                    <div class="form-group" style="margin:0; flex:1;">
                                        <label>Target In-Flight Drone</label>
                                        <select id="fail-drone-sel" class="input-control">
                                            <!-- JS populated -->
                                        </select>
                                    </div>
                                    <button class="btn btn-danger" onclick="injectFailure()">Inject Failure</button>
                                </div>
                            </div>

                        </div>

                        <!-- Event Log -->
                        <div class="card" style="display:flex; flex-direction:column; padding:0; overflow:hidden;">
                            <div
                                style="padding: 16px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2);">
                                <h3 style="margin:0; font-size:1.1rem;">Live Event Log</h3>
                            </div>
                            <div class="log-container" id="event-log">
                                <!-- JS populated -->
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script>
        const API = 'http://localhost:8000/api';
        let simStatus = 'stopped';
        let logInterval = null;

        document.addEventListener('DOMContentLoaded', () => {
            if (window.HDL.Router) window.HDL.Router.init();

            // Speed selector
            document.querySelectorAll('#speed-selector .pill-btn').forEach(btn => {
                btn.addEventListener('click', e => {
                    document.querySelectorAll('#speed-selector .pill-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    window.HDL.UI.showToast(`Simulation speed set to ${e.target.textContent}`, 'info');
                });
            });

            populateDrones();
            addLog('ℹ️ Simulation Control Panel initialized.', 'success');
        });

        function setSimStatus(status) {
            if (simStatus === status && status !== 'stopped') return;

            simStatus = status;
            const badge = document.getElementById('sim-status-badge');
            const text = document.getElementById('sim-status-text');

            badge.className = `status-badge ${status}`;
            text.textContent = status.toUpperCase();

            if (status === 'running') {
                window.HDL.UI.showToast('Simulation started', 'success');
                addLog('▶️ Simulation Engine started.', 'success');
            } else if (status === 'paused') {
                window.HDL.UI.showToast('Simulation paused', 'warning');
                addLog('⏸️ Simulation paused.', 'warn');
            } else {
                window.HDL.UI.showToast('Simulation stopped', 'error');
                addLog('⏹️ Simulation stopped.', 'error');
            }
        }

        async function resetSim() {
            const token = localStorage.getItem('hdl_admin_token');
            window.HDL.UI.showConfirm("Are you sure? This will delete ALL orders and assignments.", async () => {
                try {
                    const res = await fetch(`${API}/admin/reset-system?token=${token}`, { method: 'POST' });
                    if (res.ok) {
                        document.getElementById('event-log').innerHTML = '';
                        addLog('🔄 System Reset complete. All databases cleared.', 'success');
                        window.HDL.UI.showToast('System reset successful', 'success');
                        populateDrones();
                    }
                } catch(e) {
                    window.HDL.UI.showToast('Reset failed', 'error');
                }
            });
        }

        async function populateDrones() {
            const sel = document.getElementById('fail-drone-sel');
            const token = localStorage.getItem('hdl_admin_token');
            try {
                const res = await fetch(`${API}/drones/`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const drones = await res.json();
                    let html = drones
                        .filter(d => d.status !== 'maintenance' && d.status !== 'failed')
                        .map(d => `<option value="${d.id}">${d.drone_id} (${d.status})</option>`)
                        .join('');
                    
                    sel.innerHTML = html || '<option value="">No active drones</option>';
                }
            } catch(e) {
                sel.innerHTML = '<option value="">Error loading drones</option>';
            }
        }

        async function generateOrders() {
            const num = parseInt(document.getElementById('gen-order-num').value);
            const token = localStorage.getItem('hdl_admin_token');
            if (isNaN(num) || num < 1) return;

            addLog(`📦 Attempting to generate ${num} test orders...`, 'info');
            
            // Simulation: create random orders in loop
            let successCount = 0;
            for(let i=0; i<num; i++) {
                const res = await fetch(`${API}/orders/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        pickup_latitude: 17.3850 + (Math.random() - 0.5) * 0.1,
                        pickup_longitude: 78.4867 + (Math.random() - 0.5) * 0.1,
                        delivery_latitude: 17.3850 + (Math.random() - 0.5) * 0.1,
                        delivery_longitude: 78.4867 + (Math.random() - 0.5) * 0.1,
                        package_weight: 1 + Math.random() * 2,
                        priority: 2
                    })
                });
                if (res.ok) successCount++;
            }
            
            addLog(`✅ Successfully created ${successCount} orders.`, 'success');
            window.HDL.UI.showToast(`Batch generation complete`, 'success');
        }

        async function injectFailure() {
            const sel = document.getElementById('fail-drone-sel');
            const droneId = sel.value;
            const token = localStorage.getItem('hdl_admin_token');
            if (!droneId) return;

            window.HDL.UI.showConfirm(`Force failure on Drone ${droneId}?`, async () => {
                try {
                    // Update drone status to maintenance or similar
                    const res = await fetch(`${API}/admin/drones/${droneId}?token=${token}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            drone_id: "FAILED-" + droneId.substring(0,4),
                            model: "Emergency-Mode",
                            max_payload: 1.0,
                            max_range: 1.0,
                            battery_capacity: 100
                        })
                    });
                    
                    if (res.ok) {
                        addLog(`❌ CRITICAL: Drone ${droneId} engine failure reported!`, 'error');
                        window.HDL.UI.showToast('Failure injected', 'error');
                        populateDrones();
                    }
                } catch(e) {
                    window.HDL.UI.showToast('Injection failed', 'error');
                }
            });
        }

        function addLog(message, type = 'info') {
            const container = document.getElementById('event-log');
            const now = new Date();
            const timeStr = `[${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}]`;
            
            const div = document.createElement('div');
            div.className = `log-entry ${type}`;
            div.innerHTML = `<span class="time">${timeStr}</span><span class="msg">${message}</span>`;
            
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>

</html>
