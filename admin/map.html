<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map | HDL Quick-Commerce</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/map.css">
</head>

<body>

    <div id="app-container">
        <aside id="sidebar">
            <div class="logo-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"
                    style="color:var(--accent);">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 2L2 7l10 5 10-5-10-5zm0 10l-10 5 10 5 10-5-10-5z" />
                </svg>
                <h1>HDL System</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item"><span>📊</span> Dashboard</a>
                <a href="orders.html" class="nav-item"><span>📦</span> Orders</a>
                <a href="map.html" class="nav-item"><span>🗺️</span> Live Map</a>
                <a href="drones.html" class="nav-item"><span>🚁</span> Drone Fleet</a>
                <a href="assignments.html" class="nav-item"><span>📋</span> Assignments</a>
                <a href="analytics.html" class="nav-item"><span>📈</span> Analytics</a>
                <a href="dark-stores.html" class="nav-item">
                    <span>??</span> Dark Stores
                </a>
                <div class="nav-divider"></div>
                <a href="simulation.html" class="nav-item admin-only dev-only"><span>🎮</span> Simulation</a>
                <a href="benchmarks.html" class="nav-item admin-only dev-only"><span>⚡</span> Benchmarks</a>
                <a href="settings.html" class="nav-item admin-only"><span>⚙️</span> Settings</a>
            </nav>
        </aside>

        <main id="main-content">
            <header id="topbar">
                <h2 class="page-title">Live Map & Tracking</h2>
                <div class="status-center">
                    <div class="status-dot"></div>
                    <span>WebSocket Connected</span>
                </div>
                <div class="user-controls">
                    <span class="user-name">User</span>
                    <button class="btn-logout">Logout</button>
                </div>
            </header>

            <div id="page-content" style="padding: 32px;">
                <div id="map-wrapper">
                    <div id="main-map" style="width:100%; height:100%;"></div>

                    <!-- Top Right Layer Toggle -->
                    <div class="floating-panel floating-panel-tr">
                        <h4 style="margin-bottom: 12px; font-size:1rem;">Map Layers</h4>
                        <label class="layer-toggle">
                            <input type="checkbox" id="layer-drones" checked> Drones
                        </label>
                        <label class="layer-toggle">
                            <input type="checkbox" id="layer-routes" checked> Routes
                        </label>
                        <label class="layer-toggle">
                            <input type="checkbox" id="layer-zones" checked> No-Fly Zones
                        </label>
                        <label class="layer-toggle">
                            <input type="checkbox" id="layer-orders"> Pickup/Delivery
                        </label>
                    </div>

                    <!-- Bottom Left Info Panel -->
                    <div class="floating-panel floating-panel-bl" id="drone-info-panel">
                        <div
                            style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <h4 style="font-size:1.1rem; margin:0;" id="panel-drone-id">Drone D1</h4>
                            <span id="panel-drone-status" class="badge">Status</span>
                        </div>
                        <div class="info-row"><span class="info-label">Battery</span><span class="info-val"
                                id="panel-drone-battery">100%</span></div>
                        <div class="info-row"><span class="info-label">Payload</span><span class="info-val"
                                id="panel-drone-payload">0 kg</span></div>
                        <div class="info-row"><span class="info-label">ETA</span><span class="info-val"
                                id="panel-drone-eta">-</span></div>
                        <button class="btn-close" style="position:absolute; top:8px; right:8px; font-size:1.2rem;"
                            onclick="document.getElementById('drone-info-panel').style.display='none';">&times;</button>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="js/mock-data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script>
        let mainMap;
        let droneMarkers = {};
        let routeLines = [];
        let zonePolygons = [];
        let orderMarkers = [];

        // Manage Layer visibility
        let showDrones = true;
        let showRoutes = true;
        let showZones = true;
        let showOrders = false;

        document.addEventListener('DOMContentLoaded', () => {
            if (window.HDL.Router) window.HDL.Router.init();

            initMainMap();
            setupLayerToggles();

            // Simulate real-time movement
            setInterval(updateDronesLocation, 2000);
        });

        function initMainMap() {
            mainMap = L.map('main-map', { zoomControl: false }).setView([17.3850, 78.4867], 13);
            L.control.zoom({ position: 'bottomright' }).addTo(mainMap);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(mainMap);

            renderZones();
            renderRoutes();
            initialRenderDrones();
        }

        function setupLayerToggles() {
            document.getElementById('layer-drones').addEventListener('change', e => {
                showDrones = e.target.checked;
                Object.values(droneMarkers).forEach(m => showDrones ? mainMap.addLayer(m) : mainMap.removeLayer(m));
            });
            document.getElementById('layer-routes').addEventListener('change', e => {
                showRoutes = e.target.checked;
                routeLines.forEach(l => showRoutes ? mainMap.addLayer(l) : mainMap.removeLayer(l));
            });
            document.getElementById('layer-zones').addEventListener('change', e => {
                showZones = e.target.checked;
                zonePolygons.forEach(p => showZones ? mainMap.addLayer(p) : mainMap.removeLayer(p));
            });
            document.getElementById('layer-orders').addEventListener('change', e => {
                showOrders = e.target.checked;
                if (showOrders) renderOrders();
                else {
                    orderMarkers.forEach(m => mainMap.removeLayer(m));
                    orderMarkers = [];
                }
            });
        }

        function renderZones() {
            window.HDL.mockData.zones.forEach(z => {
                const poly = L.polygon(z.coordinates, {
                    color: '#EF4444',
                    fillColor: '#EF4444',
                    fillOpacity: 0.15,
                    weight: 2
                });
                poly.bindTooltip(z.name);
                zonePolygons.push(poly);
                if (showZones) poly.addTo(mainMap);
            });
        }

        function renderRoutes() {
            window.HDL.mockData.assignments.forEach(a => {
                const line = L.polyline(a.route, { color: '#2563EB', weight: 3, opacity: 0.6, dashArray: '8, 8' });
                routeLines.push(line);
                if (showRoutes) line.addTo(mainMap);
            });
        }

        function renderOrders() {
            window.HDL.mockData.orders.forEach(o => {
                if (o.status === 'completed' || o.status === 'failed') return;
                const pMarker = L.circleMarker(o.pickup, { radius: 5, fillColor: '#22C55E', color: '#FFFFFF', weight: 1, fillOpacity: 1 });
                const dMarker = L.circleMarker(o.delivery, { radius: 5, fillColor: '#EF4444', color: '#FFFFFF', weight: 1, fillOpacity: 1 });
                pMarker.bindTooltip('Pickup: ' + o.id);
                dMarker.bindTooltip('Dropoff: ' + o.id);

                orderMarkers.push(pMarker, dMarker);
                if (showOrders) { pMarker.addTo(mainMap); dMarker.addTo(mainMap); }
            });
        }

        function getDroneColor(status) {
            if (status === 'available') return '#2563EB';
            if (status === 'assigned') return '#F59E0B';
            if (status === 'in-flight') return '#22C55E';
            if (status === 'failed') return '#EF4444';
            return '#8B9AB3';
        }

        function initialRenderDrones() {
            window.HDL.mockData.drones.forEach((d, i) => {
                // Base random starting point across map
                d._lat = 40.710 + (i * 0.005);
                d._lng = -74.020 + (Math.random() * 0.04);

                createOrUpdateDroneMarker(d);
            });
        }

        function createOrUpdateDroneMarker(d) {
            if (!showDrones) return;

            const pos = [d._lat, d._lng];
            const color = getDroneColor(d.status);

            if (!droneMarkers[d.id]) {
                // Create
                const marker = L.circleMarker(pos, { radius: 8, fillColor: color, color: '#FFFFFF', weight: 2, fillOpacity: 1 });

                // Custom battery label using tooltip that's permanently open
                marker.bindTooltip(`${d.battery}%`, { permanent: true, direction: 'bottom', className: 'battery-tooltip', offset: [0, 8] });

                // Click event to show info panel
                marker.on('click', () => { showDroneInfo(d); });

                droneMarkers[d.id] = marker;
                marker.addTo(mainMap);
            } else {
                // Update
                const marker = droneMarkers[d.id];
                marker.setLatLng(pos);
                marker.setStyle({ fillColor: color });
                marker.setTooltipContent(`${Math.floor(d.battery)}%`);

                // Update element classes for low battery pulsing
                const tooltipEl = marker.getTooltip().getElement();
                if (d.battery < 20) {
                    if (marker._path) marker._path.classList.add('marker-low-battery');
                    if (tooltipEl) tooltipEl.style.color = '#EF4444';
                } else {
                    if (marker._path) marker._path.classList.remove('marker-low-battery');
                    if (tooltipEl) tooltipEl.style.color = 'var(--text-primary)';
                }
            }
        }

        function showDroneInfo(d) {
            const panel = document.getElementById('drone-info-panel');
            panel.style.display = 'block';
            document.getElementById('panel-drone-id').textContent = `Drone ${d.id}`;

            const sBadge = document.getElementById('panel-drone-status');
            sBadge.textContent = d.status.toUpperCase();
            sBadge.className = `badge ${window.HDL.UI.setBadgeColor(d.status)}`;

            document.getElementById('panel-drone-battery').textContent = `${Math.floor(d.battery)}%`;

            // Find assignment
            const assgn = window.HDL.mockData.assignments.find(a => a.droneId === d.id);
            if (assgn) {
                // Find order
                const order = window.HDL.mockData.orders.find(o => o.id === assgn.orderId);
                document.getElementById('panel-drone-payload').textContent = order ? `${order.weight} kg` : '-';
                document.getElementById('panel-drone-eta').textContent = assgn.eta;
            } else {
                document.getElementById('panel-drone-payload').textContent = '0 kg';
                document.getElementById('panel-drone-eta').textContent = '-';
            }
        }

        function updateDronesLocation() {
            window.HDL.mockData.drones.forEach(d => {
                if (d.status === 'in-flight' || d.status === 'assigned') {
                    // slight random movement
                    d._lat += (Math.random() - 0.5) * 0.0005;
                    d._lng += (Math.random() - 0.5) * 0.0005;

                    if (d.status === 'in-flight') {
                        d.battery = Math.max(0, d.battery - 0.5); // decrease battery
                    }
                    createOrUpdateDroneMarker(d);

                    // update open panel if it's this drone
                    const panelTitle = document.getElementById('panel-drone-id').textContent;
                    if (panelTitle === `Drone ${d.id}`) {
                        document.getElementById('panel-drone-battery').textContent = `${Math.floor(d.battery)}%`;
                    }
                }
            });
        }
    </script>
</body>

</html>
