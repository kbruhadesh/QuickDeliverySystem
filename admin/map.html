<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Map | HDL Quick-Commerce</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet" />

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/map.css">
</head>

<body>

    <div id="app-container">
        <aside id="sidebar">
            <div class="logo-container">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="24" height="24"
                    style="color:var(--accent);">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 2L2 7l10 5 10-5-10-5zm0 10l-10 5 10 5 10-5-10-5z" />
                </svg>
                <h1>HDL System</h1>
            </div>
            <nav>
                <a href="dashboard.html" class="nav-item"><span>📊</span> Dashboard</a>
                <a href="orders.html" class="nav-item"><span>📦</span> Orders</a>
                <a href="map.html" class="nav-item"><span>🗺️</span> Live Map</a>
                <a href="drones.html" class="nav-item"><span>🚁</span> Drone Fleet</a>
                <a href="assignments.html" class="nav-item"><span>📋</span> Assignments</a>
                <a href="analytics.html" class="nav-item"><span>📈</span> Analytics</a>
                <a href="dark-stores.html" class="nav-item">
                    <span>??</span> Dark Stores
                </a>
                <div class="nav-divider"></div>
                <a href="simulation.html" class="nav-item admin-only dev-only"><span>🎮</span> Simulation</a>
                <a href="benchmarks.html" class="nav-item admin-only dev-only"><span>⚡</span> Benchmarks</a>
                <a href="settings.html" class="nav-item admin-only"><span>⚙️</span> Settings</a>
            </nav>
        </aside>

        <main id="main-content">
            <header id="topbar">
                <h2 class="page-title">Live Map & Tracking</h2>
                <div class="status-center">
                    <div class="status-dot"></div>
                    <span>WebSocket Connected</span>
                </div>
                <div class="user-controls">
                    <span class="user-name">User</span>
                    <button class="btn-logout">Logout</button>
                </div>
            </header>

            <div id="page-content" style="padding: 32px;">
                <div id="map-wrapper">
                    <div id="main-map" style="width:100%; height:100%;"></div>

                    <!-- Top Right Layer Toggle -->
                    <div class="floating-panel floating-panel-tr">
                        <h4 style="margin-bottom: 12px; font-size:1rem;">Map Layers</h4>
                        <label class="layer-toggle">
                            <input type="checkbox" id="layer-drones" checked> Drones
                        </label>
                        <label class="layer-toggle">
                            <input type="checkbox" id="layer-routes" checked> Routes
                        </label>
                        <label class="layer-toggle">
                            <input type="checkbox" id="layer-zones"> No-Fly Zones
                        </label>
                        <label class="layer-toggle">
                            <input type="checkbox" id="layer-orders"> Pickup/Delivery
                        </label>
                    </div>

                    <!-- Bottom Left Info Panel -->
                    <div class="floating-panel floating-panel-bl" id="drone-info-panel">
                        <div
                            style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                            <h4 style="font-size:1.1rem; margin:0;" id="panel-drone-id">Drone D1</h4>
                            <span id="panel-drone-status" class="badge">Status</span>
                        </div>
                        <div class="info-row"><span class="info-label">Battery</span><span class="info-val"
                                id="panel-drone-battery">100%</span></div>
                        <div class="info-row"><span class="info-label">Payload</span><span class="info-val"
                                id="panel-drone-payload">0 kg</span></div>
                        <div class="info-row"><span class="info-label">ETA</span><span class="info-val"
                                id="panel-drone-eta">-</span></div>
                        <button class="btn-close" style="position:absolute; top:8px; right:8px; font-size:1.2rem;"
                            onclick="document.getElementById('drone-info-panel').style.display='none';">&times;</button>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/router.js"></script>
    <script>
        const API = 'http://localhost:8000/api';
        let mainMap;
        let droneMarkers = {};
        let routeLines = [];
        let zonePolygons = [];
        let orderMarkers = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (window.HDL.Router) window.HDL.Router.init();
            initMainMap();
            setupLayerToggles();
            connectTelemetry();
        });

        async function initMainMap() {
            mainMap = L.map('main-map', { zoomControl: false }).setView([17.3850, 78.4867], 13);
            L.control.zoom({ position: 'bottomright' }).addTo(mainMap);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(mainMap);

            // Handle URL tracking
            const urlParams = new URLSearchParams(window.location.search);
            const trackOrderId = urlParams.get('order');

            if (trackOrderId) {
                try {
                    const token = localStorage.getItem('hdl_admin_token');
                    const res = await fetch(`${API}/orders/${trackOrderId}?token=${token}`);
                    if (res.ok) {
                        const o = await res.json();
                        mainMap.setView([o.delivery_latitude, o.delivery_longitude], 15);
                        
                        L.marker([o.pickup_latitude, o.pickup_longitude], {
                            icon: L.divIcon({ className: 'custom-marker', html: '🟢', iconSize: [20,20] })
                        }).addTo(mainMap).bindTooltip("Pickup: HDL-" + trackOrderId.substring(0,8));

                        L.marker([o.delivery_latitude, o.delivery_longitude], {
                            icon: L.divIcon({ className: 'custom-marker', html: '📍', iconSize: [20,20] })
                        }).addTo(mainMap).bindTooltip("Delivery: HDL-" + trackOrderId.substring(0,8));
                    }
                } catch(e) {}
            }

            fetchNFZs();
            fetchAssignments();
        }

        async function fetchNFZs() {
            if (!document.getElementById('layer-zones').checked) return;
            
            try {
                // Get map bounds to fetch only visible NFZs
                const bounds = mainMap.getBounds();
                const res = await fetch(`${API}/admin/nfz?min_lat=${bounds.getSouth()}&min_lon=${bounds.getWest()}&max_lat=${bounds.getNorth()}&max_lon=${bounds.getEast()}`);
                
                if (res.ok) {
                    const data = await res.json();
                    
                    // Clear old zones
                    zonePolygons.forEach(p => mainMap.removeLayer(p));
                    zonePolygons = [];

                    L.geoJSON(data, {
                        pointToLayer: (feature, latlng) => {
                            return L.circle(latlng, {
                                radius: feature.properties.buffer_m || 50,
                                color: '#EF4444',
                                fillColor: '#EF4444',
                                fillOpacity: 0.2,
                                weight: 1
                            });
                        },
                        onEachFeature: (feature, layer) => {
                            layer.bindTooltip(feature.properties.name || "Restricted Zone");
                        }
                    }).addTo(mainMap).on('add', (e) => zonePolygons.push(e.target));
                }
            } catch(e) {}
        }

        async function fetchAssignments() {
            const token = localStorage.getItem('hdl_admin_token');
            try {
                const res = await fetch(`${API}/assignments/?token=${token}`);
                if (res.ok) {
                    const data = await res.json();
                    data.forEach(a => {
                        if (a.route_path && a.route_path.length > 0) {
                            const line = L.polyline(a.route_path, { color: '#2563EB', weight: 3, opacity: 0.6, dashArray: '8, 8' });
                            routeLines.push(line);
                            if (document.getElementById('layer-routes').checked) line.addTo(mainMap);
                        }
                    });
                }
            } catch(e) {}
        }

        function connectTelemetry() {
            const ws = new WebSocket('ws://localhost:8000/api/drones/ws');
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (!data.drones) return;
                
                data.drones.forEach(d => {
                    updateDroneMarker(d);
                });
            };
            ws.onerror = () => {
                console.warn("WebSocket error - falling back to polling");
                setInterval(pollDrones, 3000);
            };
        }

        async function pollDrones() {
            const token = localStorage.getItem('hdl_admin_token');
            try {
                const res = await fetch(`${API}/drones/`, { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const drones = await res.json();
                    drones.forEach(d => {
                        updateDroneMarker({
                            id: d.id,
                            drone_id: d.drone_id,
                            lat: d.latitude,
                            lon: d.longitude,
                            battery: d.current_battery,
                            status: d.status
                        });
                    });
                }
            } catch(e) {}
        }

        function updateDroneMarker(d) {
            if (!d.lat || !d.lon) return;
            const pos = [d.lat, d.lon];
            const color = getDroneColor(d.status);

            if (!droneMarkers[d.id]) {
                const marker = L.circleMarker(pos, { radius: 8, fillColor: color, color: '#FFFFFF', weight: 2, fillOpacity: 1 });
                marker.bindTooltip(`${Math.floor(d.battery)}%`, { permanent: true, direction: 'bottom', className: 'battery-tooltip', offset: [0, 8] });
                marker.on('click', () => showDroneInfo(d));
                droneMarkers[d.id] = marker;
                if (document.getElementById('layer-drones').checked) marker.addTo(mainMap);
            } else {
                const marker = droneMarkers[d.id];
                marker.setLatLng(pos);
                marker.setStyle({ fillColor: color });
                marker.setTooltipContent(`${Math.floor(d.battery)}%`);
            }
        }

        function getDroneColor(status) {
            if (status === 'idle') return '#2563EB';
            if (status === 'assigned') return '#F59E0B';
            if (status === 'in_flight') return '#22C55E';
            if (status === 'maintenance') return '#EF4444';
            return '#8B9AB3';
        }

        function showDroneInfo(d) {
            const panel = document.getElementById('drone-info-panel');
            panel.style.display = 'block';
            document.getElementById('panel-drone-id').textContent = d.drone_id || `Drone ${d.id}`;
            document.getElementById('panel-drone-status').textContent = (d.status || 'unknown').toUpperCase();
            document.getElementById('panel-drone-battery').textContent = `${Math.floor(d.battery)}%`;
            document.getElementById('panel-drone-payload').textContent = d.payload ? `${d.payload} kg` : '-';
        }

        function setupLayerToggles() {
            document.getElementById('layer-drones').addEventListener('change', e => {
                Object.values(droneMarkers).forEach(m => e.target.checked ? mainMap.addLayer(m) : mainMap.removeLayer(m));
            });
            document.getElementById('layer-routes').addEventListener('change', e => {
                routeLines.forEach(l => e.target.checked ? mainMap.addLayer(l) : mainMap.removeLayer(l));
            });
            document.getElementById('layer-zones').addEventListener('change', e => {
                if (e.target.checked) fetchNFZs();
                else {
                    zonePolygons.forEach(p => mainMap.removeLayer(p));
                    zonePolygons = [];
                }
            });
        }
    </script>
</body>

</html>
