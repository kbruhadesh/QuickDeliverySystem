<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | HDL Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #2563EB;
            --accent-hover: #1D4ED8;
            --danger: #EF4444;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border: #E5E7EB;
            --bg: #F0F4FF;
            --card: #FFFFFF;
            --radius: 12px;
            --font-body: 'DM Sans', sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            font-family: var(--font-body);
            background: linear-gradient(135deg, #EFF6FF 0%, #F0F4FF 50%, #EEF2FF 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: var(--card);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.12);
            padding: 48px;
            width: 100%;
            max-width: 420px;
            animation: fadeUp 0.4s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand-name {
            font-family: var(--font-heading);
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand-sub {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        h1 {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: #FAFAFA;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: #fff;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-family: var(--font-body);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        .btn:hover  { background: var(--accent-hover); }
        .btn:active { transform: scale(0.98); }
        .btn:disabled { background: #93B4F7; cursor: not-allowed; }

        .error-msg {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: var(--danger);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 28px 0;
        }

        .info-box {
            background: #EFF6FF;
            border-radius: 10px;
            padding: 14px 16px;
            font-size: 13px;
            color: #1E40AF;
        }

        .info-box strong { display: block; margin-bottom: 4px; font-weight: 600; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand">
        <div class="brand-icon">🚁</div>
        <div>
            <div class="brand-name">HDL Operations</div>
            <div class="brand-sub">Admin Portal</div>
        </div>
    </div>

    <h1>Sign in</h1>
    <p class="subtitle">Access the drone fleet management dashboard.</p>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="admin@hdl.com" required autocomplete="username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button class="btn" type="submit" id="login-btn">Sign In</button>
    </form>

    <div class="divider"></div>

    <div class="info-box">
        <strong>🔒 Restricted Access</strong>
        This portal is for authorized HDL operations staff only. Unauthorized access is prohibited.
    </div>
</div>

<script>
const API = 'http://localhost:8000/api';

document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('login-btn');
    const errorMsg = document.getElementById('error-msg');

    errorMsg.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Signing in...';

    try {
        // 1. Get token
        const res = await fetch(`${API}/auth/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`, {
            method: 'POST'
        });

        if (!res.ok) {
            const data = await res.json().catch(() => ({}));
            throw new Error(data.detail || 'Invalid email or password');
        }

        const { access_token } = await res.json();

        // 2. Verify role via /auth/me
        const meRes = await fetch(`${API}/auth/me?token=${access_token}`);
        if (!meRes.ok) throw new Error('Could not verify user');
        const user = await meRes.json();

        // 3. Store session
        localStorage.setItem('hdl_admin_token', access_token);
        localStorage.setItem('hdl_admin_user', JSON.stringify(user));

        // 4. Redirect to dashboard
        window.location.href = 'dashboard.html';

    } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
    } finally {
        btn.disabled = false;
        btn.innerHTML = 'Sign In';
    }
});
</script>

</body>
</html>
